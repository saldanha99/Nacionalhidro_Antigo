name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          debug: true
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull origin main
            echo "=== Docker Swarm Stacks ==="
            docker stack ls || true
            echo "=== Stopping any compose containers ==="
            docker compose -f docker-compose-legacy.yml down || true
            echo "=== Building images ==="
            docker compose -f docker-compose-legacy.yml build
            echo "=== Deploying Swarm Stack ==="
            docker stack deploy -c docker-compose-legacy.yml nacionalhidro-legacy
            echo "=== Deployment Finished ==="
