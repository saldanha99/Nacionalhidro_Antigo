name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          debug: true
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull origin main
            echo "=== Docker Network Info ==="
            docker network ls
            if docker network inspect hidro >/dev/null 2>&1; then
              if ! docker network inspect hidro | grep -q '"Attachable": true'; then
                echo "Network hidro exists but is not attachable. Attempting to recreate..."
                docker network rm hidro || echo "Could not remove network hidro (probably in use)."
                docker network create --driver overlay --attachable hidro || true
              else
                echo "Network hidro is already attachable."
              fi
            else
              echo "Network hidro does not exist. Creating..."
              docker network create --driver overlay --attachable hidro || true
            fi
            echo "=========================="
            docker compose -f docker-compose-legacy.yml up --build -d
